<th:block th:replace="~{fragments/shell :: shell(~{::content}, ${bodyClass}, false)}">
<th:block th:fragment="content" th:inline="text">
<h1>Edit profile</h1>
<form method="post" th:action="${contextPath + '/account/edit'}" class="form-stack narrow" data-busy-guard>
    <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
    <label>Display name<input type="text" name="displayName" required th:value="${account.displayName}"/></label>
    <label>Email<input type="email" name="email" required th:value="${account.email}"/></label>
    <label>Phone<input type="text" name="phone" th:value="${account.phone}"/></label>
    <button type="submit" class="button">Save changes</button>
</form>
</th:block>
</th:block>
