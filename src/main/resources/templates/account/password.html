<th:block th:replace="~{fragments/shell :: shell(~{::content}, ${bodyClass}, false)}">
<th:block th:fragment="content" th:inline="text">
<h1>Change password</h1>
<form method="post" th:action="${contextPath + '/account/password'}" class="form-stack narrow" data-busy-guard>
    <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
    <label>Current password<input type="password" name="currentPassword" required/></label>
    <label>New password<input type="password" name="newPassword" required minlength="8"/></label>
    <label>Confirm new password<input type="password" name="confirmPassword" required minlength="8"/></label>
    <button type="submit" class="button">Update password</button>
</form>
</th:block>
</th:block>
