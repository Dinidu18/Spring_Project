<th:block th:replace="~{fragments/shell :: shell(~{::content}, ${bodyClass}, false)}">
<th:block th:fragment="content" th:inline="text">
<div class="section-head"><h1>Books</h1><a class="button" th:href="${contextPath + '/admin/books/new'}">New book</a></div>
<table class="data-table">
    <thead><tr><th>Title</th><th>Author</th><th>Type</th><th></th></tr></thead>
    <tbody>
    <th:block th:each="book : ${books}">
        <tr>
            <td><span th:text="${book.title}"></span></td>
            <td><span th:text="${book.author}"></span></td>
            <td>[[${book.typeCode}]]</td>
            <td>
                <a th:href="${contextPath + '/admin/books/edit' + '?id=' + book.id}">Edit</a>
                ·
                <a th:href="${contextPath + '/admin/books/delete' + '?id=' + book.id}">Delete</a>
            </td>
        </tr>
    </th:block>
    </tbody>
</table>
<p><a th:href="${contextPath + '/admin'}">← Dashboard</a></p>
</th:block>
</th:block>
