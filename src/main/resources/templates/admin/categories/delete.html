<th:block th:replace="~{fragments/shell :: shell(~{::content}, ${bodyClass}, false)}">
<th:block th:fragment="content" th:inline="text">
<h1>Delete category</h1>
<p>Delete “<span th:text="${category.name}"></span>”? Must have no books assigned.</p>
<form method="post" th:action="${contextPath + '/admin/categories/delete'}" data-busy-guard>
    <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
    <input type="hidden" name="id" th:value="${category.id}"/>
    <button type="submit" class="button button-danger">Delete</button>
</form>
</th:block>
</th:block>
