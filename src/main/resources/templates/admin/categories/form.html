<th:block th:replace="~{fragments/shell :: shell(~{::content}, ${bodyClass}, false)}">
<th:block th:fragment="content" th:inline="text">
<h1><span th:text="${pageTitle}"></span></h1>
<form method="post" th:action="${contextPath + '/admin/categories/save'}" class="form-stack narrow" data-busy-guard>
    <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
    <th:block th:if="${!(category == null)}"><input type="hidden" name="id" th:value="${category.id}"/></th:block>
    <label>Name<input name="name" required th:value="${category != null ? category.name : ''}"/></label>
    <label>Description<textarea name="description" required minlength="10">[[${category != null ? category.description : ''}]]</textarea></label>
    <label>Image key
        <select name="imageKey" required>
            <th:block th:each="key : ${imageKeys}">
                <option th:value="${key}" th:selected="${category != null and category.imageKey == key}">[[${key}]]</option>
            </th:block>
        </select>
    </label>
    <button type="submit" class="button">Save</button>
</form>
</th:block>
</th:block>
