<th:block th:replace="~{fragments/shell :: shell(~{::content}, ${bodyClass}, false)}">
<th:block th:fragment="content" th:inline="text">
<h1><span th:text="${message.subject}"></span></h1>
<p class="meta"><span th:text="${message.name}"></span> · <span th:text="${message.email}"></span></p>
<p><span th:text="${message.message}"></span></p>
<p><a th:href="${contextPath + '/admin/contact'}">← Back to inbox</a></p>
</th:block>
</th:block>
