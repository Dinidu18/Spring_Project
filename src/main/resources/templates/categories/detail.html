<th:block th:replace="~{fragments/shell :: shell(~{::content}, ${bodyClass}, false)}">
<th:block th:fragment="content" th:inline="text">
<h1><span th:text="${category.name}"></span></h1>
<p><span th:text="${category.description}"></span></p>
<div class="card-grid">
    <th:block th:each="book : ${catalog.items}">
        <article class="book-card">
            <a th:href="${contextPath + '/books/detail' + '?id=' + book.id}">
                <img th:src="${contextPath + assets.assetUrl(book.coverImageKey)}" th:alt="${assets.assetAlt(book.coverImageKey)}"/>
                <h3><span th:text="${book.title}"></span></h3>
            </a>
        </article>
    </th:block>
</div>
</th:block>
</th:block>
