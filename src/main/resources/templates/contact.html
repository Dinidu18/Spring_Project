<th:block th:replace="~{fragments/shell :: shell(~{::content}, ${bodyClass}, false)}">
<th:block th:fragment="content" th:inline="text">
<h1 class="page-title">Contact</h1>
<p class="lede" style="color:var(--muted);margin-top:-.4rem;margin-bottom:1.2rem;">Questions about a title, an account, or this demo site? Send a note.</p>
<form method="post" th:action="${contextPath + '/contact'}" class="form-stack" data-busy-guard style="background:#fff;border:1px solid var(--border);border-radius:20px;padding:1.35rem;box-shadow:var(--shadow-soft);">
    <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
    <label>Name<input type="text" name="name" required minlength="2" maxlength="80" th:value="${formName}"/></label>
    <label>Email<input type="email" name="email" required maxlength="120" th:value="${formEmail}"/></label>
    <label>Subject<input type="text" name="subject" required minlength="3" maxlength="120"/></label>
    <label>Message<textarea name="message" required minlength="10" maxlength="3000" rows="6"></textarea></label>
    <button type="submit" class="button">Send message</button>
</form>
</th:block>
</th:block>
