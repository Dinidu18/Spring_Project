<th:block th:replace="~{fragments/shell :: shell(~{::content}, ${bodyClass}, false)}">
<th:block th:fragment="content" th:inline="text">
<h1>Delete review</h1>
<p>Remove “<span th:text="${review.title}"></span>”?</p>
<form method="post" th:action="${contextPath + '/reviews/delete'}" class="form-stack narrow" data-busy-guard>
    <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
    <input type="hidden" name="id" th:value="${review.id}"/>
    <button type="submit" class="button button-danger">Delete review</button>
</form>
</th:block>
</th:block>
