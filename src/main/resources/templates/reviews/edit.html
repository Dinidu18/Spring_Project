<th:block th:replace="~{fragments/shell :: shell(~{::content}, ${bodyClass}, false)}">
<th:block th:fragment="content" th:inline="text">
<h1>Edit review</h1>
<form method="post" th:action="${contextPath + '/reviews/edit'}" class="form-stack narrow" data-busy-guard>
    <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
    <input type="hidden" name="id" th:value="${review.id}"/>
    <label>Rating<input type="number" name="rating" min="1" max="5" th:value="${review.rating}" required/></label>
    <label>Title<input type="text" name="title" required th:value="${review.title}"/></label>
    <label>Review<textarea name="body" required rows="8">[[${review.body}]]</textarea></label>
    <button type="submit" class="button">Save</button>
</form>
</th:block>
</th:block>
