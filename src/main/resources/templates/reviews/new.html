<th:block th:replace="~{fragments/shell :: shell(~{::content}, ${bodyClass}, false)}">
<th:block th:fragment="content" th:inline="text">
<h1>Review: <span th:text="${book.title}"></span></h1>
<form method="post" th:action="${contextPath + '/reviews/new'}" class="form-stack narrow" data-busy-guard data-star-rating>
    <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
    <input type="hidden" name="bookId" th:value="${book.id}"/>
    <label>Rating (1–5)<input type="number" name="rating" min="1" max="5" value="5" required/></label>
    <label>Title<input type="text" name="title" required minlength="3" maxlength="100"/></label>
    <label>Review<textarea name="body" required minlength="10" maxlength="3000" rows="8"></textarea></label>
    <button type="submit" class="button">Publish review</button>
</form>
</th:block>
</th:block>
